[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "musictools"
dynamic = ["version"]
description = "Tag, cover and ID3 cleanup for mp3/flac libraries"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = ["mutagen>=1.47"]

[project.scripts]
musictools = "musictools.cli:main"

[tool.setuptools]
packages = ["musictools"]

[tool.setuptools.dynamic]
version = { attr = "musictools.__version__" }

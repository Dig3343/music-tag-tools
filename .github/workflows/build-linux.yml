name: build-linux-executable

# Builds the x86_64 Linux executable. Run it by hand (Actions tab -> build-linux-executable -> Run workflow)
# or it runs automatically when a release is published and attaches the archive to that release.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tk build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv
      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt pyinstaller
      - name: Build
        run: |
          .venv/bin/pyinstaller --noconfirm --clean --onefile --name musictools \
            --add-data "assets/icon.png:assets" \
            --add-data "assets/icon-dark.png:assets" \
            --collect-all customtkinter \
            musictools_app.py
          chmod +x dist/musictools
          tar -czf dist/musictools-linux-x86_64.tar.gz -C dist musictools
      - uses: actions/upload-artifact@v4
        with:
          name: musictools-linux-x86_64
          path: dist/musictools-linux-x86_64.tar.gz
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/musictools-linux-x86_64.tar.gz --clobber
